<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Opening BMM…</title>
<!--
  A bouncer for `bmm://` deeplinks.

  Why it exists: the PDF editions of these docs carry "open this in BMM" links, and a PDF
  reader will not launch a custom scheme. Acrobat asks, Edge and Firefox hand it to the OS,
  Chrome's built-in viewer refuses outright and does not even make the region clickable —
  which is what a reader actually sees: a link that does nothing.

  An https link is clickable in every reader. So the PDF links here, and this page fires the
  deeplink from a browser, where custom schemes do work. It also gives the reader somewhere
  to land when BMM is not installed, which a raw bmm:// link never could.

  Kept as plain HTML rather than a markdown page: it must not carry the site chrome, and it
  has to run its script before anything else paints.
-->
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #fff; color: #1a1a1a;
  }
  @media (prefers-color-scheme: dark) { body { background: #16181a; color: #ebedee; } }
  main { max-width: 34rem; padding: 2rem 1.5rem; text-align: center; }
  h1 { font-size: 1.35rem; margin: 0 0 .6rem; }
  p { margin: .6rem 0; }
  code {
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: .85em; padding: .15em .4em; border-radius: 3px;
    background: rgba(127,127,127,.18); word-break: break-all;
  }
  a { color: #1a5fb4; }
  @media (prefers-color-scheme: dark) { a { color: #7cb4f7; } }
  .btn {
    display: inline-block; margin-top: 1rem; padding: .55rem 1.1rem;
    border-radius: .25rem; background: #1d4ed8; color: #fff;
    text-decoration: none; font-weight: 700;
  }
  .muted { opacity: .75; font-size: .9rem; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1 id="title">Opening BMM…</h1>
  <p id="lead">If nothing happens, BMM may not be installed, or your browser may be waiting
     for you to allow it.</p>
  <p><code id="target"></code></p>
  <p id="fallback" class="hidden">
    <a class="btn" id="retry" href="#">Open BMM</a>
  </p>
  <p class="muted">
    <a href="../">Back to the documentation</a> ·
    <a href="https://github.com/FreeProject089">Get BMM</a>
  </p>
</main>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var to = params.get('to') || '';

  // Only ever bounce to bmm://. Without this the page would be an open redirect: anyone
  // could hand out a link to this domain that lands somewhere else entirely, and it would
  // carry whatever trust the docs site has.
  if (to.slice(0, 6).toLowerCase() !== 'bmm://') {
    document.getElementById('title').textContent = 'Not a BMM link';
    document.getElementById('lead').textContent =
      'This page only opens bmm:// deeplinks. The address below was refused.';
    document.getElementById('target').textContent = to || '(nothing given)';
    return;
  }

  document.getElementById('target').textContent = to;
  document.getElementById('retry').href = to;
  document.getElementById('fallback').classList.remove('hidden');

  // location.href rather than a synthetic click: a click on an unregistered scheme is a
  // silent no-op in some browsers, whereas assigning it produces the "open an app?" prompt.
  try { location.href = to; } catch (e) { /* the button below is the fallback */ }
})();
</script>
</body>
</html>
