# GTK-free PDF build. `mkdocs.pdf.yml` uses mkdocs-with-pdf → WeasyPrint → GTK system libs
# (libgobject/pango/cairo), which aren't present on a plain Windows box. This config instead
# uses mkdocs-print-site-plugin to fold the whole site into ONE page (`/print_page/`), then a
# headless Chrome prints that page to PDF — Chrome runs the page's JS, so the 28 Mermaid
# diagrams render (WeasyPrint could not, it needed a pre-render hook).
#
#   python tools/build_pdf_chrome.py        # pdf/bettermodsmanager.pdf (EN) + .fr.pdf (FR)
#
# Do not build this file directly for a book: with the i18n plugin below, print-site writes ONE
# /print_page/ and the French pass overwrites it, so the « English » book comes out French.
# build_pdf_chrome.py builds each language as its own site that INHERITs this file and replaces
# the plugin list (search + print-site, no i18n). The plugins below only matter for a by-hand build.
#
# The interactive .bmmreplay players don't appear in a static PDF (as with any PDF of
# interactive content) — they are a web-only feature.
INHERIT: mkdocs.yml

plugins:
  - search:
      lang: [en, fr]
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: fr
          name: Français
          build: true
  - print-site:
      add_to_navigation: false
      print_page_title: 'BetterModsManager — Documentation'
      add_cover_page: true
      add_table_of_contents: true
      toc_title: 'Contents'
      enumerate_headings: false
      enumerate_figures: false

# Declaring extra_css here REPLACES the inherited list, so the base sheet is re-listed
# alongside the PDF one. The rrweb player CSS is dropped on purpose (replays are hidden in
# print). pdf-print.css must come last so it wins.
extra_css:
  - assets/extra.css
  - assets/pdf-print.css
