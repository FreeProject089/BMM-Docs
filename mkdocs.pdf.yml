# The PDF build. Everything comes from mkdocs.yml; this only bolts the renderer on top.
#
# It's a separate file because mkdocs imports every plugin listed in a config, even a
# disabled one — and mkdocs-with-pdf pulls in WeasyPrint, which needs GTK system libraries
# (libgobject/pango/cairo). Listing it in the main config made `mkdocs serve` fail on any
# Windows machine without GTK, which is most of them. So: contributors use mkdocs.yml and
# never install GTK; CI (ubuntu, with the libs) builds the PDF with
#     mkdocs build -f mkdocs.pdf.yml
INHERIT: mkdocs.yml

plugins:
  - search:
      lang: [en, fr]
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: fr
          name: Français
          build: true
  - with-pdf:
      cover_title: BetterModsManager
      cover_subtitle: Documentation
      output_path: pdf/bettermodsmanager.pdf
      # NOT `render_js: true`. The plugin's own browser pass is broken with current
      # BeautifulSoup — it ends on `tag.text = ...` (generator.py:381), a read-only property,
      # so the build dies as soon as a page has an inline <script>, which every Material page
      # does. pdf_event_hook.py at the repo root does the same job from `pre_pdf_render`,
      # which is what turns the 28 mermaid fences into SVG instead of printed source code.
