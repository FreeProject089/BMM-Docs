site_name: BetterModsManager — Documentation
site_description: Guide complet de BetterModsManager, de zéro / The complete BetterModsManager guide, from zero
site_url: https://freeproject089.github.io/BMM-Docs/
repo_url: https://github.com/FreeProject089/BMM-Docs
edit_uri: edit/master/docs/

# The docs live in their own repo. Screenshots are committed under docs/assets/screens/ as
# RAW captures; the numbered call-outs are drawn by tools/annotate.py from a JSON spec at
# build time, so an annotation is versioned text — re-runnable when the UI moves, instead of
# a hand-painted PNG nobody can update. See README.md and WRITING_COMMANDS.md.

theme:
  name: material
  # overrides/main.html adds the "Download the PDF" button to every page. It is a theme
  # override rather than mkdocs-with-pdf's own inject_link because that one does not survive
  # mkdocs-static-i18n's second build pass — the returned markup carried the button and the
  # file written to disk did not. This also means the button exists under `mkdocs serve`,
  # where the PDF plugin is not loaded at all.
  custom_dir: overrides
  language: en
  # The header logo is the brand TILE (frontend/assets/brand/bmm-logo-tile.svg): the plain
  # mark is black + yellow and its black half vanishes on the dark header. The tile carries
  # its own light rounded square, so it reads on both schemes. logo.png stays for the PDF
  # tooling; the .ico carries several sizes, which is what a browser tab actually wants.
  logo: assets/bmm-logo-tile.svg
  favicon: assets/favicon.ico
  # System fonts, not Google Fonts: Material's default `font:` loads Roboto from
  # fonts.googleapis.com on every page view — an outside request on a site whose privacy page
  # says BMM makes none it doesn't need. The stacks themselves are in assets/extra.css.
  font: false
  icon:
    repo: fontawesome/brands/github
    admonition:
      tip: material/lightbulb-on-outline
      note: material/pencil-outline
      warning: material/alert-outline
      danger: material/alert-octagon-outline
      info: material/information-outline
      example: material/flask-outline
      question: material/help-circle-outline
  # BMM is yellow (#ffcc00) on near-black (#121315). The palette names below are only
  # Material's fallbacks — assets/extra.css sets the real values per scheme, and keeps the
  # yellow a FILL (buttons, rails, badges) with dark text on it, never yellow text on white.
  palette:
    - media: "(prefers-color-scheme)"
      toggle: { icon: material/brightness-auto, name: Follow system / Suivre le système }
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/brightness-7, name: Dark mode / Mode sombre }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/brightness-4, name: Light mode / Mode clair }
  features:
    # No navigation.instant: it breaks mkdocs-static-i18n's language switcher (the build
    # warns, and the FR/EN toggle stops following you page to page). Instant nav isn't
    # worth losing the switcher on a bilingual site.
    # Tabs: the four top sections become header tabs, so the sidebar lists one section at a
    # time instead of ~70 pages. On a phone the tabs fold back into the drawer.
    - navigation.tabs
    - navigation.path
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - toc.follow

plugins:
  - search:
      lang: [en, fr]
  # One tree, two languages: a page has an .fr.md sibling; anything not translated yet falls
  # back to English rather than 404ing, so the FR site is always complete-looking and the
  # gaps are visible in the build log.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: fr
          name: Français
          build: true
          nav_translations:
            Getting started: Premiers pas
            Step by step: Pas à pas
            Features: Fonctionnalités
            How it works: Comment ça marche
            Reference: Référence
            Install BMM: Installer BMM
            First launch: Premier lancement
            Library: Bibliothèque
            .MM Lists: Listes .MM
            Profiles: Profils
            Modpacks: Modpacks
            Server Repo: Dépôt Serveur
            Plugins & API: Plugins & API
            App Catalog: App Catalog
            Mapper: Mapper
            BetterCommunity: BetterCommunity
            Settings: Paramètres
            Customise navigation: Personnaliser la navigation
            Change history & release notes: Historique des changements & notes de version
            Translation studio: Studio de traduction
            Activity centre: Centre d'activité
            BMM Tools: Outils BMM
            Command palette & shortcuts: Palette de commandes & raccourcis
            GitHub rate limits & the Personal Access Token: Limites GitHub et le jeton d'accès personnel
            Start-up screen & announcements: Écran de démarrage & annonces
            Launch packs: Launch packs
            Privacy, telemetry & offline: Confidentialité, télémétrie & hors ligne
            Optional AI (Laya): IA optionnelle (Laya)
            Local Laya API: API Laya locale
            AI security: Sécurité de l'IA
            Activation order: Ordre d'activation
            Scheduling & automation: Planification & automatisation
            Storage & disk I/O: Stockage & E/S disque
            The resource governor: Le gouverneur de ressources
            Themes & Appearance: Thèmes & Apparence
            Make your own theme: Créer son propre thème
            Credits: Crédits
            API reference: Référence API
            Action reference: Référence des actions
            MCP server reference: Référence du serveur MCP
            Troubleshooting: Dépannage
  # NOTE: the PDF plugin is deliberately NOT here — see mkdocs.pdf.yml. It renders through
  # WeasyPrint, which needs GTK system libraries; mkdocs imports a listed plugin even when
  # it's disabled, so keeping it in this file made `mkdocs serve` die on Windows with
  # "cannot load library 'libgobject-2.0-0'". Contributors get a config that just works;
  # CI adds the PDF via the inheriting config.

# BCWEB-style `:::tip[…] … :::` callout directives are rewritten to Material admonitions before
# parsing (same authoring syntax as the in-app docs). See tools/md_directives.py.
hooks:
  - tools/md_directives.py

markdown_extensions:
  - admonition
  - pymdownx.keys      # keyboard keys: ++ctrl+k++ renders styled <kbd> chips (matches the in-app docs' :kbd[…])
  - pymdownx.details
  # `- [ ] step` lists on the guide pages: a checkbox the page script (assets/guide.js) makes tickable.
  - pymdownx.tasklist:
      custom_checkbox: true
  # Mermaid diagrams: `\`\`\`mermaid` fences render as interactive SVG (Material's native
  # support). Used across the "How it works" section to show BMM's internals visually.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - attr_list
  - md_in_html
  # :material-…: / :octicons-…: shortcodes become INLINE SVG at build time (the icon set ships
  # inside mkdocs-material) — the home page's feature cards use them. No font, no request.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

