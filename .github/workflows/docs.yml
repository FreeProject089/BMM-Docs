name: Docs

# Builds the bilingual site + a single PDF, and publishes to GitHub Pages on master.
# A PR gets the same build (and the PDF as an artifact) without publishing, so a broken
# link or a stale screenshot annotation is caught before it reaches the site.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # lfs: true is REQUIRED. The .bmmreplay recordings are LFS-tracked (.gitattributes), and a
      # plain checkout writes 130-byte pointer files instead of the real ones — which mkdocs then
      # copies to the site verbatim, so every inline replay player on the published docs tried to
      # parse a pointer as JSON and silently showed nothing.
      - uses: actions/checkout@v4
        with:
          lfs: true

      # Both failure modes here are SILENT on the published site — the player just shows
      # nothing — so they have to be caught at build time.
      - name: Replay assets are real files, and every embed resolves
        run: |
          for f in docs/assets/replays/*.bmmreplay; do
            head -c 40 "$f" | grep -q 'version https://git-lfs' \
              && { echo "::error file=$f::LFS pointer, not the recording — checkout needs lfs: true"; exit 1; }
          done
          missing=0
          # Every data-src the pages point at must actually exist. `mkdocs --strict` only
          # validates markdown links, not raw HTML attributes, so a renamed or never-recorded
          # clip sails straight through it.
          grep -rho 'replays/[a-z0-9-]*\.bmmreplay' docs --include='*.md' | sort -u | while read -r ref; do
            name="${ref#replays/}"
            [ "$name" = "your-recording.bmmreplay" ] && continue   # the example in the README
            [ -f "docs/assets/replays/$name" ] || { echo "::error::embedded replay not found: $name"; exit 1; }
          done || missing=1
          [ "$missing" = "0" ] || exit 1
          echo "OK: $(ls docs/assets/replays/*.bmmreplay | wc -l) replay file(s), all embeds resolve"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # mkdocs-with-pdf renders through WeasyPrint, which needs real system libs — without
      # these the PDF step fails with an opaque cairo/pango error rather than a missing-dep one.
      - name: System deps for the PDF renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libffi-dev shared-mime-info

      - run: pip install -r requirements.txt

      # The call-outs are generated from JSON specs. If someone edits a spec (or retakes a
      # screenshot) and forgets to re-render, the site would ship a picture that disagrees
      # with its own numbering — so fail here instead.
      - name: Screenshot annotations are up to date
        run: python tools/annotate.py --check

      # Two passes on purpose. `mkdocs.yml` has no PDF plugin (it would drag WeasyPrint's GTK
      # libs into every contributor's `mkdocs serve` — see mkdocs.pdf.yml's header), so the PDF
      # only exists via the inheriting config. This used to be a single `mkdocs build --strict`
      # with an ENABLE_PDF=1 env var that nothing reads, so no PDF was ever rendered and the
      # upload step below was uploading nothing.
      # Order matters: `mkdocs build` cleans site/ first, so the PDF pass must come LAST or it
      # would be wiped. mkdocs.pdf.yml INHERITs mkdocs.yml and its plugin list is a superset
      # (search + i18n + with-pdf), so the second pass reproduces the same site and adds the PDF.
      - name: Build site
        run: mkdocs build --strict   # --strict: a broken internal link fails the build

      - name: Build PDF
        run: mkdocs build -f mkdocs.pdf.yml   # → site/pdf/bettermodsmanager.pdf

      - uses: actions/upload-artifact@v4
        with:
          name: bettermodsmanager-pdf
          path: site/pdf/bettermodsmanager.pdf
          if-no-files-found: error

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/master'
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
