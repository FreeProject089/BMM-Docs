name: Docs

# Builds the bilingual site + a single PDF, and publishes to GitHub Pages on master.
# A PR gets the same build (and the PDF as an artifact) without publishing, so a broken
# link or a stale screenshot annotation is caught before it reaches the site.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # lfs: true is REQUIRED. The .bmmreplay recordings are LFS-tracked (.gitattributes), and a
      # plain checkout writes 130-byte pointer files instead of the real ones — which mkdocs then
      # copies to the site verbatim, so every inline replay player on the published docs tried to
      # parse a pointer as JSON and silently showed nothing.
      - uses: actions/checkout@v5
        with:
          lfs: true

      # Both failure modes here are SILENT on the published site — the player just shows
      # nothing — so they have to be caught at build time.
      - name: Replay assets are real files, and every embed resolves
        run: |
          for f in docs/assets/replays/*.bmmreplay; do
            head -c 40 "$f" | grep -q 'version https://git-lfs' \
              && { echo "::error file=$f::LFS pointer, not the recording — checkout needs lfs: true"; exit 1; }
          done
          missing=0
          # Every data-src the pages point at must actually exist. `mkdocs --strict` only
          # validates markdown links, not raw HTML attributes, so a renamed or never-recorded
          # clip sails straight through it.
          grep -rho 'replays/[a-z0-9-]*\.bmmreplay' docs --include='*.md' | sort -u | while read -r ref; do
            name="${ref#replays/}"
            [ "$name" = "your-recording.bmmreplay" ] && continue   # the example in the README
            [ -f "docs/assets/replays/$name" ] || { echo "::error::embedded replay not found: $name"; exit 1; }
          done || missing=1
          [ "$missing" = "0" ] || exit 1
          echo "OK: $(ls docs/assets/replays/*.bmmreplay | wc -l) replay file(s), all embeds resolve"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # mkdocs-with-pdf renders through WeasyPrint, which dlopens real system libraries —
      # without them the PDF step dies on an opaque "cannot load library" rather than a
      # missing-dependency message.
      #
      # This list is derived from what the INSTALLED WeasyPrint actually loads
      # (weasyprint/text/ffi.py), not from memory. Modern WeasyPrint dropped cairo and
      # gdk-pixbuf — both were in this list and unused since v53 — and gained harfbuzz,
      # including libharfbuzz-subset, which is its own Ubuntu package and is NOT pulled in
      # by pango. A machine with only pango installed fails on that one alone.
      - name: System deps for the PDF renderer
        run: |
          sudo apt-get update
          # fonts-noto-color-emoji is not a WeasyPrint dependency — it is a content one. The
          # docs use emoji (🎓 👍 🔥 ⭐ 🚀 …) and a runner without an emoji font renders each
          # one as .notdef, a blank box, with only a WARNING in the log.
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libharfbuzz-subset0 libfontconfig1 shared-mime-info fonts-noto-color-emoji
          # Prove every library WeasyPrint will dlopen is present, here rather than deep
          # inside a mkdocs traceback.
          for lib in libpango-1.0.so.0 libpangoft2-1.0.so.0 libharfbuzz.so.0 libharfbuzz-subset.so.0 libfontconfig.so.1 libgobject-2.0.so.0; do
            ldconfig -p | grep -q "$lib" || { echo "::error::missing $lib — WeasyPrint cannot load it"; exit 1; }
          done
          echo "OK: every WeasyPrint native dependency is present"

      - run: pip install -r requirements.txt

      # The call-outs are generated from JSON specs. If someone edits a spec (or retakes a
      # screenshot) and forgets to re-render, the site would ship a picture that disagrees
      # with its own numbering — so fail here instead.
      - name: Screenshot annotations are up to date
        run: python tools/annotate.py --check

      # Two passes on purpose. `mkdocs.yml` has no PDF plugin (it would drag WeasyPrint's GTK
      # libs into every contributor's `mkdocs serve` — see mkdocs.pdf.yml's header), so the PDF
      # only exists via the inheriting config. This used to be a single `mkdocs build --strict`
      # with an ENABLE_PDF=1 env var that nothing reads, so no PDF was ever rendered and the
      # upload step below was uploading nothing.
      # Order matters: `mkdocs build` cleans site/ first, so the PDF pass must come LAST or it
      # would be wiped. mkdocs.pdf.yml INHERITs mkdocs.yml and its plugin list is a superset
      # (search + i18n + with-pdf), so the second pass reproduces the same site and adds the PDF.
      - name: Build site
        run: mkdocs build --strict   # --strict: a broken internal link fails the build

      # pdf_event_hook.py shells out to a browser to turn the mermaid fences into SVG.
      # google-chrome is preinstalled on ubuntu-latest. The hook only WARNS when no browser
      # is found — a contributor building locally should still get a readable PDF — so the
      # hard failure belongs here, or CI would quietly ship a book with 28 code blocks where
      # its diagrams should be.
      - name: A browser for the diagram pass
        run: |
          command -v google-chrome >/dev/null \
            || { echo "::error::google-chrome not found — the mermaid diagrams would print as source"; exit 1; }
          google-chrome --version

      # -v so mkdocs-with-pdf's own log ("Converting N articles to PDF") and WeasyPrint's
      # warnings are in the run log. Without it a PDF that silently loses 90% of the book
      # builds exactly as quietly as a correct one — which is how the published 8-page PDF
      # got there.
      - name: Build PDF
        run: mkdocs build -v -f mkdocs.pdf.yml   # → site/pdf/bettermodsmanager.pdf

      # The build cannot tell whether WeasyPrint laid out what it was handed, so read the
      # finished file back. "The docs site" is the last heading of Credits, the LAST page in
      # the nav — a truncated render still contains every early page, so only a late phrase
      # proves it went all the way through. That exact phrase because it survives extraction:
      # depending on which fonts the runner has, pypdf returns some bold runs as unmappable
      # glyphs, and "View the tech stack" (bold) came back missing from a PDF that plainly
      # contained it.
      - name: The PDF contains the documentation
        run: |
          python tools/check_pdf.py site/pdf/bettermodsmanager.pdf \
            --min-pages 40 --expect "The docs site"
          python tools/check_pdf.py site/fr/pdf/bettermodsmanager.pdf \
            --min-pages 40 --expect "Le site de doc"

      # Both languages. mkdocs-static-i18n runs the PDF plugin once per locale (plugin.py,
      # the with_pdf_plugin.on_post_build loop), so the French book has always been built —
      # it just never left the runner, because only site/pdf was uploaded. It reached Pages,
      # since the whole site/ directory goes there, but a PR reviewer could not see it.
      - uses: actions/upload-artifact@v4
        with:
          name: bettermodsmanager-pdf
          path: |
            site/pdf/bettermodsmanager.pdf
            site/fr/pdf/bettermodsmanager.pdf
          if-no-files-found: error

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/master'
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
